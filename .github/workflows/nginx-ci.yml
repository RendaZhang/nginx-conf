name: Nginx CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13.14 for CI tooling
        uses: actions/setup-python@v7
        with:
          python-version: 3.13.14

      - name: Show CI tooling runtime
        run: |
          python --version
          python -m pip --version

      - name: Install pinned pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.2.0

      - name: Validate repository invariants
        run: bash scripts/validate_repository.sh

      - name: Run pre-commit hooks
        run: pre-commit run --all-files
