# Shared security headers for public HTTPS responses.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: https://*.sentry.io; script-src 'self' 'report-sample' https://cdn.credly.com https://fonts.googleapis.com https://js.sentry-cdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://www.credly.com; object-src 'none'; media-src 'self'; connect-src 'self' https://*.sentry.io; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
