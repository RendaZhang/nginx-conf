# Shared security headers for public HTTPS responses.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: https://*.sentry.io; script-src 'self' 'report-sample' 'sha256-QzWFZi+FLIx23tnm9SBU4aEgx4x8DsuASP07mfqol/c=' 'sha256-U7a72oKuFFz8D7GUHLA1NZ0ciymHmDOc9T9aVDg2rWU=' 'sha256-Q2BPg90ZMplYY+FSdApNErhpWafg2hcRRbndmvxuL/Q=' 'sha256-UHe1meAWRK+8Zoz3TfFBwXdJLXzDSA1GuEs8oRqxVt8=' 'sha256-9PM+iIXt2xgJUXAwbq9LGlzgU9Wqrfd7/UpLbzfA+Tk=' https://cdn.credly.com https://fonts.googleapis.com https://js.sentry-cdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://www.credly.com; object-src 'none'; media-src 'self'; connect-src 'self' https://*.sentry.io; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
