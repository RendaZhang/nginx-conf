server {
    listen       80 default_server;
    server_name  _;  # 匹配所有未指定域名的请求

    # IP黑名单检查 (放在所有location之前)
    if ($deny_access = "block") {
        return 444;  # 静默关闭连接
    }

    # 添加调试日志记录
    access_log /var/log/nginx/ip-blocked.log block_fmt if=$deny_access;

    #  ===== 缓存清理端点 =====
    # Allow local cache purge over HTTP
    location ~ ^/cloudchat/purge-cache/(.+)$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        # 只允许PURGE方法
        if ($request_method != "PURGE") {
            return 405;
        }

        proxy_cache_purge cloudchat_cache $1;
    }

    # +++ 恶意请求拦截规则 +++
    location ~* (device\.rsp|___S_O_S_T_R_E_A_M) {
        access_log /var/log/nginx/hack.log;  # 单独记录恶意请求
        deny all;
        return 444;  # 直接关闭连接，不返回任何内容
    }

    # Redirect all other traffic to the canonical HTTPS host
    location / {
        return 301 https://www.rendazhang.com$request_uri;
    }
}

# HTTPS canonical redirect for apex host
server {
    listen       443 ssl http2;
    server_name  rendazhang.com;

    include snippets/ssl-rendazhang.conf;
    include snippets/security-headers.conf;

    return 301 https://www.rendazhang.com$request_uri;
}

# HTTPS server
server {
    listen       443 ssl http2;
    server_name  www.rendazhang.com;

    # ====== ① 站点根路径（所有静态文件基准）======
    root   /var/www/html;                # ← 绝对路径
    index  index.html index.htm;

    include snippets/security-headers.conf;

    # ===== 缓存状态头（调试用）=====
    add_header X-Cache-Status $upstream_cache_status;
    include snippets/ssl-rendazhang.conf;

    # IP 黑名单检查 (放在所有location之前)
    if ($deny_access = "block") {
        return 444;  # 静默关闭连接
    }

    access_log /var/log/nginx/ip-blocked.log block_fmt if=$deny_access;

    # +++ 恶意请求拦截规则 +++
    location ~* (device\.rsp|___S_O_S_T_R_E_A_M) {
        access_log /var/log/nginx/hack.log;
        deny all;
        return 444;
    }

    # Allow standards-based well-known files but block hidden/sensitive paths.
    location ^~ /.well-known/ {
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known/) {
        include snippets/security-headers.conf;
        return 404;
    }

    # Only the public, non-user-specific cache demonstration route is cacheable.
    location = /cloudchat/test {
        limit_req zone=flask_limit burst=10 nodelay;

        proxy_cache cloudchat_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_methods GET HEAD;
        proxy_cache_min_uses 2;

        proxy_pass http://127.0.0.1:5000/test;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_redirect off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /cloudchat/ {
        limit_req zone=flask_limit burst=10 nodelay;

        client_body_buffer_size 128k;
        client_max_body_size 10M;
        client_body_temp_path /var/lib/nginx/body;
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;       # 与 Gunicorn 的 timeout 配置保持一致
        proxy_send_timeout 300s;       # 5分钟超时
        proxy_connect_timeout 75s;
        proxy_redirect off;            # 禁用 Nginx 对后端服务器返回的重定向响应进行修改
        proxy_set_header Connection "";
        proxy_set_header Host $host;   # 传递客户端请求的原始主机名
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

    }

    # Paid streaming Chat has a lower independent rate boundary.
    location = /cloudchat/deepseek_chat {
        limit_req zone=chat_limit burst=3 nodelay;

        client_body_buffer_size 128k;
        client_max_body_size 10M;
        client_body_temp_path /var/lib/nginx/body;
        proxy_pass http://127.0.0.1:5000/deepseek_chat;
        proxy_http_version 1.1;
        proxy_buffering off;           # 支持流式传输；关闭后 proxy_cache 将失效
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_redirect off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

    }

    # 指纹文件目录，缓存一年
    location ^~ /_astro/ {
        access_log off;
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML / XML / JSON —— 不缓存
    location ~* \.(html?|xml|json)$ {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Last-Modified $date_gmt;
        try_files $uri =404;
    }

    # 其余静态资源（CSS/JS/图片等）
    location ~* \.(css|js|mjs|woff2?|ttf|eot|otf|gif|jpe?g|png|webp|svg)$ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location ~ /package\.json { internal; }
    location ~ /package-lock\.json { internal; }
    location ~ /\.git { internal; }
    location ~ /\.gitignore { internal; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    error_page 500 502 503 504 /500.html;
    location = /500.html { internal; }

    # Static Astro routes: serve existing files only; unknown paths must stay real 404s.
    location / {
        try_files $uri $uri/ =404;
    }

}
