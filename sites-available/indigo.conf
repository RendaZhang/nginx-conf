server {
    listen 80;
    server_name indigo.rendazhangisthebest.top;

    if ($deny_access = "block") {
        return 444;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-indigo;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://indigo.rendazhangisthebest.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name indigo.rendazhangisthebest.top;
    root /var/www/indigo/current;

    ssl_certificate /etc/letsencrypt/live/indigo.rendazhangisthebest.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indigo.rendazhangisthebest.top/privkey.pem;
    include snippets/ssl-policy.conf;

    if ($deny_access = "block") {
        return 444;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /_indigo_session_check {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        include proxy_params;
        proxy_pass http://127.0.0.1:5101/api/auth/check;
    }

    location ~ ^/(?:advisers|practice)(?:/|$) {
        if (!-f $document_root/practice/index.html) {
            return 404;
        }
        auth_request /_indigo_session_check;
        error_page 401 =200 /login/index.html;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/index.html =404;
    }

    location = /login/index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ^~ /api/ {
        # A placeholder rollback also takes the adviser API off the public site.
        if (!-f $document_root/practice/index.html) {
            return 404;
        }
        include proxy_params;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://127.0.0.1:5101;
    }

    location ^~ /cloudchat/ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
