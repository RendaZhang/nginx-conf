server {
    listen 80;
    server_name indigo.rendazhangisthebest.top;
    root /var/www/indigo/current;

    if ($deny_access = "block") {
        return 444;
    }

    location = / {
        try_files /index.html =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-indigo;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /cloudchat/ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri =404;
    }
}
